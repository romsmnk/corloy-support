<footer class="footer">
  <nav>
    <a href="/terms/">Умови використання</a> &middot;
    <a href="/privacy/">Політика конфіденційності</a> &middot;
    <a href="/support/">Підтримка</a>
  </nav>

  <div class="footer-copy">
    Останнє оновлення: жовтень 2025 року<br>
    &copy; Corner Coffee — усі права захищено
  </div>
</footer>

<style>
  .footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 2px solid #e2e8f0;
    text-align: center;
    font-size: 16px;
    color: #4a5568;
  }

  .footer nav a {
    color: #4a5568;
    text-decoration: none;
    margin: 0 6px;
    transition: color 0.2s ease;
  }

  .footer nav a:hover {
    color: #667eea;
  }

  .footer nav a.active {
    color: #764ba2;
    font-weight: bold;
    text-decoration: underline;
  }

  .footer-copy {
    margin-top: 10px;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const currentPath = location.pathname.replace(/\/$/, '');
    document.querySelectorAll('.footer nav a').forEach(link => {
      const href = link.getAttribute('href').replace(/\/$/, '');
      if (href === currentPath) link.classList.add('active');
    });
  });
</script>
